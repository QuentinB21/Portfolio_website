name: portfolio-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN}
      WWW_DOMAIN: ${WWW_DOMAIN}
      UMAMI_DOMAIN: ${UMAMI_DOMAIN}
      TRADECOPILOT_FRONTEND_UPSTREAM: ${TRADECOPILOT_FRONTEND_UPSTREAM:-tradecopilot-client:80}
      TRADECOPILOT_API_UPSTREAM: ${TRADECOPILOT_API_UPSTREAM:-tradecopilot-api:8080}
      TRADECOPILOT_AUTH_UPSTREAM: ${TRADECOPILOT_AUTH_UPSTREAM:-tradecopilot-keycloak:8080}
      MAILMANAGER_FRONTEND_UPSTREAM: ${MAILMANAGER_FRONTEND_UPSTREAM:-mail-manager-web:80}
      MAILMANAGER_API_UPSTREAM: ${MAILMANAGER_API_UPSTREAM:-mail-manager-api:8080}
      MAILMANAGER_AUTH_UPSTREAM: ${MAILMANAGER_AUTH_UPSTREAM:-mail-manager-keycloak:8080}
      MAILMANAGER_WORKFLOW_UPSTREAM: ${MAILMANAGER_WORKFLOW_UPSTREAM:-mail-manager-n8n:5678}
    volumes:
      - ./deploy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - portfolio
      - umami
    networks:
      - default
      - public-proxy

  portfolio:
    build:
      context: .
      args:
        VITE_CV_PDF_URL: ${VITE_CV_PDF_URL:-/cv.pdf}
        VITE_CV_MARKDOWN_URL: ${VITE_CV_MARKDOWN_URL:-}
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID}
    restart: unless-stopped
    expose:
      - '80'
    environment:
      PORT: 80
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      PROFILE_BIRTHDATE: ${PROFILE_BIRTHDATE}
      CHATBOT_SYSTEM_PROMPT: ${CHATBOT_SYSTEM_PROMPT}
    depends_on:
      - umami

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${UMAMI_DB_NAME}
      POSTGRES_USER: ${UMAMI_DB_USER}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER}:${UMAMI_DB_PASSWORD}@umami-db:5432/${UMAMI_DB_NAME}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      - umami-db

volumes:
  caddy-data:
  caddy-config:
  umami-db-data:

networks:
  public-proxy:
    external: true
